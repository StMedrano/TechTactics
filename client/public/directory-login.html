<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening TechTactics Portal</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #102033;
        --gold: #d79a25;
        --paper: #f6efe0;
      }

      body {
        align-items: center;
        background: radial-gradient(circle at top, #fff8e8 0, var(--paper) 45%, #e8d9b9 100%);
        color: var(--ink);
        display: flex;
        font-family: Georgia, "Times New Roman", serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(16, 32, 51, 0.12);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(16, 32, 51, 0.18);
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      a {
        color: var(--ink);
        font-weight: 700;
      }

      .button {
        background: linear-gradient(135deg, #e2a738, #f6d47c);
        border-radius: 999px;
        color: #0d1724;
        display: inline-block;
        margin-top: 16px;
        padding: 14px 24px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening TechTactics Portal</h1>
      <p>You are being sent to Zoho Directory to finish signing in.</p>
      <a class="button" id="fallback-link" href="#">Continue</a>
    </main>
    <script>
      const backendStartUrl =
        'https://portalappsail-10124080596.development.catalystappsail.com/api/auth/directory/start';
      const clientAppUrl = `${window.location.origin}${window.location.pathname
        .replace(/\/directory-login\.html$/i, '')
        .replace(/\/+$/, '')}`;
      const destination = `${backendStartUrl}?returnTo=${encodeURIComponent(
        '/login'
      )}&clientOrigin=${encodeURIComponent(clientAppUrl)}`;

      document.getElementById('fallback-link').href = destination;
      window.location.replace(destination);
    </script>
  </body>
</html>

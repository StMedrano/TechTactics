server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'none'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;

    # Active preview homepage.
    location ~ ^/preview/(lead_[A-Za-z0-9_-]+)/$ {
        root /usr/share/nginx/html/artifacts;

        rewrite ^/preview/(lead_[A-Za-z0-9_-]+)/$ /$1/demo/index.html break;

        try_files $uri =404;
    }

    # Active preview static files only.
    location ~ ^/preview/(lead_[A-Za-z0-9_-]+)/(.+)$ {
        root /usr/share/nginx/html/artifacts;

        rewrite ^/preview/(lead_[A-Za-z0-9_-]+)/(.+)$ /$1/demo/$2 break;

        try_files $uri =404;
    }

    # Everything outside the explicit preview namespace is inaccessible.
    location / {
        return 404;
    }
}

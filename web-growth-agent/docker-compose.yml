services:
  web-growth-agent:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: web-growth-agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    ports:
      - "4317:4317"
    networks:
      - techtactics


  web-growth-preview:
    image: nginx:alpine
    container_name: web-growth-preview
    restart: unless-stopped
    volumes:
      - ./artifacts:/usr/share/nginx/html/artifacts:ro
      - ./preview-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4318:80"
    networks:
      - techtactics

networks:
  techtactics:
    name: techtactics

name: Web Growth Agent CI

on:
  pull_request:
    paths:
      - "web-growth-agent/**"
      - ".github/workflows/web-growth-agent.yml"
  push:
    branches: [main]
    paths:
      - "web-growth-agent/**"
      - ".github/workflows/web-growth-agent.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-growth-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-growth-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
